name: Lint Code

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax and undefined names
        run: |
          python -m pip install flake8
          flake8 server/djangoapp server/djangoproj --select=E9,F63,F7,F82

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Node service syntax
        run: node --check server/database/app.js

  build_react:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        working-directory: server/frontend
        run: |
          npm install --legacy-peer-deps
          CI=false npm run build
